name: Any Name API regression (Newman)

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - ".github/workflows/newman.yml"
      - ".github/scripts/**"
  # Weekly regression: Mondays 07:00 UTC. Runs only if the Jira gate finds tickets.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      jira_gate:
        description: "Check Jira first (run only if Ready for QA tickets with label api-regression exist)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newman-${{ github.ref }}
  cancel-in-progress: false

env:
  JIRA_BASE_URL: https://julykotsur.atlassian.net
  JIRA_JQL: labels = "api-regression" AND status = "Ready for QA" ORDER BY key ASC
  # After a gated run that passed, tickets still in EXPECTED_STATUS move to TARGET_STATUS.
  JIRA_EXPECTED_STATUS: Ready for QA
  JIRA_TARGET_STATUS: Done
  PAGES_URL: https://julykotsur-alt.github.io/any-name/

jobs:
  jira-gate:
    name: Jira gate (Ready for QA, api-regression)
    # Scheduled runs always use the gate; manual runs only with jira_gate = true.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.jira_gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_regression: ${{ steps.gate.outputs.run_regression }}
      ticket_count: ${{ steps.gate.outputs.ticket_count }}
      ticket_keys: ${{ steps.gate.outputs.ticket_keys }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Fails (not skips) when secrets are missing or the Jira login is not real.
      - name: Verify Jira login and search tickets
        id: gate
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash .github/scripts/jira-gate.sh

  newman:
    name: Petstore pet CRUD regression
    needs: jira-gate
    # Gate skipped (push / plain manual run) -> run. Gate ran -> run only if it passed and found tickets.
    if: >-
      !cancelled() &&
      (needs.jira-gate.result == 'skipped' ||
      (needs.jira-gate.result == 'success' && needs.jira-gate.outputs.run_regression == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      newman_ran: ${{ steps.newman.outcome == 'success' || steps.newman.outcome == 'failure' }}
      report_ready: ${{ steps.report.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Newman 6 and htmlextra reporter
        run: npm install -g newman@6 newman-reporter-htmlextra@1

      - name: Run Petstore collection
        id: newman
        run: |
          mkdir -p results reports
          newman run collections/petstore-collection.json \
            --reporters cli,json,htmlextra \
            --reporter-json-export results/newman-report.json \
            --reporter-htmlextra-export reports/index.html \
            --reporter-htmlextra-title "Any Name API regression (Newman)" \
            --reporter-htmlextra-browserTitle "Any Name API regression"

      - name: Check that the HTML report exists
        id: report
        if: always()
        run: |
          if [ -f reports/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HTML report was not generated"
          fi

      - name: Upload Newman JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: results/newman-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Newman HTML report
        if: always() && steps.report.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-report
          path: reports/index.html
          retention-days: 14

      # Pages artifact is prepared even when assertions fail, but only on main.
      - name: Prepare GitHub Pages artifact
        if: always() && github.ref == 'refs/heads/main' && steps.report.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/

  publish-report:
    name: Publish HTML report to GitHub Pages
    needs: newman
    # Only when Newman really ran (passed or failed assertions), on main, with a report.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.newman.outputs.newman_ran == 'true' &&
      needs.newman.outputs.report_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  jira-update:
    name: Update Jira tickets (comment; Done if passed)
    needs: [jira-gate, newman]
    # Only for gated runs (schedule / jira_gate) where Newman really ran, passed or failed.
    # The script moves tickets only when nothing failed; otherwise it just comments.
    if: >-
      !cancelled() &&
      needs.jira-gate.result == 'success' &&
      needs.jira-gate.outputs.run_regression == 'true' &&
      needs.newman.outputs.newman_ran == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Newman JSON report
        uses: actions/download-artifact@v8
        with:
          name: newman-report
          path: results

      - name: Comment on tickets and move passed ones
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEYS: ${{ needs.jira-gate.outputs.ticket_keys }}
          NEWMAN_REPORT: results/newman-report.json
          TARGET_STATUS: ${{ env.JIRA_TARGET_STATUS }}
          EXPECTED_STATUS: ${{ env.JIRA_EXPECTED_STATUS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Pages is only updated from main; other branches link to the run's artifacts.
          REPORT_URL: ${{ github.ref == 'refs/heads/main' && env.PAGES_URL || '' }}
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/jira-transition.sh
